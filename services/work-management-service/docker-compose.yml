services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexusboard
      POSTGRES_USER: nexusboard
      POSTGRES_PASSWORD: nexusboard
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusboard -d nexusboard"]
      interval: 5s
      timeout: 5s
      retries: 10
